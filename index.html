<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastFit - Virtual Try-On Extension</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
        }
        
        h1 {
            color: #2563eb;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 40px;
        }
        
        .links {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 40px;
        }
        
        .link-button {
            display: inline-block;
            padding: 15px 30px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1.1em;
            transition: background 0.3s ease;
        }
        
        .link-button:hover {
            background: #1e40af;
        }
        
        .link-button.secondary {
            background: #6b7280;
        }
        
        .link-button.secondary:hover {
            background: #4b5563;
        }
        
        .description {
            text-align: left;
            margin: 30px 0;
            padding: 20px;
            background: #f9fafb;
            border-radius: 8px;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>FastFit</h1>
        <p class="subtitle">Virtual Try-On Chrome Extension</p>
        
        <div class="description">
            <p>
                FastFit enables you to virtually try on clothing items from Amazon using AI-powered image generation. 
                See how clothing looks on you before purchasing with personalized virtual try-on images powered by Google Gemini AI.
            </p>
        </div>
        
        <div class="links">
            <a href="privacy-policy.html" class="link-button">Privacy Policy</a>
            <a href="https://github.com/usesalt/FastFit" class="link-button secondary" target="_blank">View on GitHub</a>
        </div>
    </div>
</body>
</html>
